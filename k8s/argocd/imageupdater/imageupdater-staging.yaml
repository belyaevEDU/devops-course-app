apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: currency-updater-staging
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "currency-app-staging"
      images:
        - alias: "restapi-currency"
          imageName: "belyaevedu/restapi-currency:staging"
          commonUpdateSettings:
            pullSecret: "pullsecret:argocd/dockerhub-creds"
            updateStrategy: "digest"
          manifestTargets:
            helm:
              name: "image.repository"
              tag: "image.tag"
  writeBackConfig:
    method: "git"
    gitConfig:
      repository: "https://github.com/belyaevEDU/devops-app-helm"
      branch: "main"
      writeBackTarget: "helmvalues:01-values.staging.yaml"